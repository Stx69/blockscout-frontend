# Required for `pnpm deploy` in the Docker image (favicon/sitemap generators).
# pnpm 11+ reads this from pnpm-workspace.yaml only — not from .npmrc.
injectWorkspacePackages: true

packages:
  - 'src/toolkit/package'
  - 'deploy/tools/envs-validator'
  - 'deploy/tools/feature-reporter'
  - 'deploy/tools/favicon-generator'
  - 'deploy/tools/sitemap-generator'
  - 'deploy/tools/multichain-config-generator'
  - 'deploy/tools/essential-dapps-chains-config-generator'
  - 'deploy/tools/llms-txt-generator'

verifyDepsBeforeRun: warn

# The widget-light EVM handler is patched for these wagmi v2 / viem versions.
# Resolve wallet clients per request; explicit chainId supports syncConnectedChain: false.
peerDependencyRules:
  allowedVersions:
    '@lifi/widget-light@4.3.2>wagmi': '2.19.5'
    '@lifi/widget-light@4.3.2>@wagmi/core': '2.22.1'
    '@lifi/widget-light@4.3.2>viem': '2.41.2'

overrides:
  bigint-buffer: file:vendor/bigint-buffer
  '@wagmi/connectors': "6.2.0"
  ws: "8.21.0"
  axios: '1.18.0'
  tar-fs: "2.1.4"
  node-forge: "1.4.0"
  brace-expansion: '1.1.18'
